[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "probabilistic-storm-tracks"
version = "0.1.0"
description = "Probabilistic tropical-cyclone track forecasting and evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.23,<3",
  "pandas>=1.5,<3",
  "scikit-learn>=1.3,<2",
  "scipy>=1.9,<2",
]

[project.optional-dependencies]
app = [
  "plotly>=5.14,<7",
  "streamlit>=1.51,<2",
]
notebooks = [
  "jupyter>=1,<2",
  "matplotlib>=3.7,<4",
  "nbformat>=5.9,<6",
  "seaborn>=0.12,<1",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
