# Optional health check for the deployed Streamlit app
# Keep the URL in sync with keep_alive/ping.py

name: Keep Streamlit Awake

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://hurricanepaths.streamlit.app/"
